name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `.npmrc` sets legacy-peer-deps so the heavy @deepseek-ai/* cordis
      # runtime (only needed inside a live harness) is not pulled for tests.
      - run: npm install
      - run: npm test
