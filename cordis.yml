# Example dsh loader entry for dsh-compaction-pro.
#
# PUBLISHED / INSTALLED (after `npm publish` or `dsh plugin add`):
# reference by package name — dsh resolves it from node_modules.
- id: compaction-pro
  name: 'dsh-compaction-pro'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    summaryLanguage: auto
    faithful: true
    recursive: true
    chunkMessages: 40
    # summarizationProvider / summarizationModel: leave empty to reuse the
    # conversation's routed model, or pin a cheap summarizer explicitly.
    # summarizationProvider: ''
    # summarizationModel: ''

# LOCAL DEV (no build, no publish): point `name` at the compiled-or-source file.
# dsh's loader runs .ts directly via tsx, so this works against the live source:
# - id: compaction-pro
#   name: 'C:/Users/<you>/dsh-plugins/dsh-compaction-pro/src/index.ts'
#   config:
#     faithful: true
#     recursive: true
#     summaryLanguage: auto
#     thresholdRatio: 0.8
#     retainRatio: 0.16
#     maxTokens: 8192
#     chunkMessages: 40
