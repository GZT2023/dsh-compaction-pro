# dsh bundle patch for dsh-compaction-pro (auto-applied by dsh on install).
#
# IMPORTANT: dsh-compaction-pro registers on the SAME ctx.compaction service as
# the built-in dsh-compaction-basic. Disable basic first, otherwise the
# duplicate registration crashes dsh at boot.
- id: compaction-basic
  disabled: true

- insert:
    - id: compaction-pro
      name: '@GZT2023/dsh-compaction-pro'   # <--- 必须加这个
      config:
        faithful: true
        recursive: true
        summaryLanguage: auto
        thresholdRatio: 0.8
        retainRatio: 0.16
        maxTokens: 8192
        chunkMessages: 40
        auto: true
      # summarizationProvider / summarizationModel: leave empty to reuse the
      # conversation's routed model, or pin a cheap summarizer explicitly.
      # summarizationProvider: ''
      # summarizationModel: ''
